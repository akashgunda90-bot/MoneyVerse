services:
  - type: web
    name: moneyverse-2
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
      - key: CORS_ORIGINS
        value: "*"
      # Optional remote Ollama AI instance URL (e.g. GPU cloud or Ngrok tunnel)
      # - key: OLLAMA_BASE_URL
      #   value: "https://your-remote-ollama-host.com"
      # Optional PostgreSQL database connection (Render Managed Postgres)
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: moneyverse-db
      #     property: connectionString
